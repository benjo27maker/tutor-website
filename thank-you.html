    <style>
        /* ===== Thank-you page (kept in-page so it can drop into the existing site) ===== */

        .thankyou-page {
            position: relative;
            min-height: 100vh;
            background-color: #e6e3df;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .thankyou-page::before {
            content: "";
            position: absolute;
            top: -20%;
            left: -31%;
            width: 0;
            height: 0;
            border-left: 70vw solid rgba(247, 194, 124, 0.35);
            border-top: 30vw solid rgba(247, 194, 124, 0.35);
            border-radius: 50%;
            z-index: 0;
        }

        .thankyou-page::after {
            content: "";
            position: absolute;
            bottom: -18%;
            right: -22%;
            width: 0;
            height: 0;
            border-left: 60vw solid rgba(207, 215, 201, 1);
            border-top: 32vw solid rgba(207, 215, 201, 1);
            border-radius: 50%;
            z-index: 0;
        }

        .thankyou-header {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            padding-top: 3vh;
            text-align: center;
            transition: transform 0.5s ease, opacity 0.5s ease;
        }

        .thankyou-header:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }

        

        .thankyou-header a {
            display: inline-flex;
        }

        #thankyou-logo {
            width: clamp(150px, 16vw, 220px);
        }

        .thankyou-wrapper {
            position: relative;
            z-index: 5;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4vh 5vw 8vh 5vw;
        }

        .thankyou-card {
            width: min(560px, 90vw);
            background-color: #585143;
            border: 2px solid #f3af52;
            border-radius: 25px;
            padding: 6vh 6vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.15);
        }

        .thankyou-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background-color: #f3af52;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3vh;
        }

        .thankyou-icon svg {
            width: 34px;
            height: 34px;
        }

        .thankyou-eyebrow {
            font-family: Inter;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-size: clamp(0.65rem, 1vw, 0.85rem);
            color: #f3af52;
            margin-bottom: 1.5vh;
        }

        .thankyou-card h1 {
            font-family: Outfit;
            font-weight: 600;
            letter-spacing: 3px;
            font-size: clamp(2rem, 4.5vw, 3rem);
            color: #f0efeb;
            margin-bottom: 2.5vh;
        }

        .thankyou-card p.thankyou-text {
            font-family: Inter;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1.6;
            font-size: clamp(0.9rem, 1.4vw, 1.1rem);
            color: #d8d5cf;
            max-width: 40ch;
            margin-bottom: 4.5vh;
        }

        .thankyou-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            justify-content: center;
        }

        .thankyou-btn {
            border-radius: 9px;
            font-family: Inter;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.15rem;
            padding: 0.7rem 1.4rem;
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease, letter-spacing 0.3s ease;
        }

        .thankyou-btn:hover {
            transform: scale(1.06);
            cursor: pointer;
            letter-spacing: 0.25rem;
        }

        .thankyou-btn-primary {
            border: 3px solid #f3af52;
            background-color: #c4bcad;
            color: #252525;
        }

        .thankyou-btn-primary:hover {
            background-color: #403e3a;
            color: white;
        }

        .thankyou-btn-secondary {
            border: 2px solid #f0efeb;
            background-color: transparent;
            color: #f0efeb;
        }

        .thankyou-btn-secondary:hover {
            background-color: #f0efeb;
            color: #544d3f;
        }

        .thankyou-note {
            position: relative;
            z-index: 5;
            text-align: center;
            font-family: InclusiveSans;
            font-weight: 300;
            letter-spacing: 1px;
            font-size: 0.85rem;
            color: #625b4e;
            padding-bottom: 4vh;
        }

        @media (max-width: 700px) {
            .thankyou-card {
                padding: 6vh 8vw;
            }
        }
    </style>
